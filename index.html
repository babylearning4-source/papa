<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Papa Fluid Chart</title>
<meta name="theme-color" content="#f2f5f7">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;800&display=swap">
<style>
:root{--bg:#f2f5f7;--card:#fff;--ink:#14222a;--mut:#617079;--line:#dde4e8;--in:#1d6db0;--out:#b06a10;--f:"Mukta",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root{--bg:#0e1518;--card:#162126;--ink:#e6edf0;--mut:#93a3ab;--line:#26343b;--in:#5ca8e8;--out:#e3a447;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 17px/1.4 var(--f);padding:16px;padding-top:calc(16px + env(safe-area-inset-top,0px))}
.w{max-width:480px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
h1{margin:0;font-size:1.3rem;font-weight:800}
.sub{color:var(--mut);font-size:.9rem}
.num{font-variant-numeric:tabular-nums}
/* meter */
.row{display:grid;grid-template-columns:62px 1fr 92px;align-items:center;gap:10px;margin-top:12px}
.row b{font-size:.95rem}
.track{height:22px;background:var(--bg);border-radius:11px;overflow:hidden}
.fill{height:100%;border-radius:11px;transition:width .5s}
.row .v{text-align:right;font-weight:800;font-size:1.1rem}
.diff{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;justify-content:space-between;font-weight:600}
/* entry */
.ml{display:flex;align-items:center;gap:10px}
.ml input{flex:1;min-width:0;font:800 2.2rem var(--f);padding:6px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);text-align:center}
.ml span{font-weight:800;color:var(--mut)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.btns button{border:0;border-radius:14px;padding:16px 8px;font:800 1.1rem var(--f);color:#fff;cursor:pointer}
.btns button:disabled{opacity:.5}
#bIn{background:var(--in)} #bOut{background:var(--out)}
/* list */
.day{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;padding-bottom:6px;border-bottom:1px solid var(--line)}
.day span{font-weight:600;font-size:.85rem;color:var(--mut)}
ul{list-style:none;margin:0;padding:0}
li{display:grid;grid-template-columns:70px 1fr auto 32px;gap:8px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
li:last-child{border-bottom:0}
li .t{color:var(--mut)}
li .in{color:var(--in);font-weight:600} li .out{color:var(--out);font-weight:600}
li .m{font-weight:800}
li button{border:0;background:none;color:var(--mut);font-size:1.1rem;cursor:pointer;border-radius:8px;height:32px}
li button.sure{background:#c0392b;color:#fff;font-size:.75rem;font-weight:800}
.empty{color:var(--mut);text-align:center;padding:10px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:22px;font-weight:600}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="w">
  <div class="card">
    <h1>Papa Fluid Chart</h1>
    <div class="sub" id="today">Aaj</div>
    <div class="row"><b>Pani</b><div class="track"><div class="fill" id="fIn" style="background:var(--in);width:0"></div></div><div class="v num" id="vIn">0 ml</div></div>
    <div class="row"><b>Urine</b><div class="track"><div class="fill" id="fOut" style="background:var(--out);width:0"></div></div><div class="v num" id="vOut">0 ml</div></div>
    <div class="diff"><span>Farak (Pani − Urine)</span><span class="num" id="vDiff">0 ml</span></div>
  </div>

  <div class="card">
    <div class="ml"><input id="ml" type="number" inputmode="numeric" placeholder="0" aria-label="ml"><span>ml</span></div>
    <div class="btns"><button id="bIn">Pani piya</button><button id="bOut">Urine</button></div>
  </div>

  <div id="list"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const API = 'https://script.google.com/macros/s/AKfycbzewrsv4sX2CEymrGqFCPOF_wEAktgwyQMz_VpBJV4glIDhlOEWhToeUaWKdmrxGuU_eQ/exec';
let entries = [];
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2, '0');
const nowParts = () => { const d = new Date(); return { date: d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()), time: pad(d.getHours()) + ':' + pad(d.getMinutes()) }; };
const fmtDate = s => { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d).toLocaleDateString('en-IN', { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' }); };
const fmtTime = s => { const [h, m] = s.split(':').map(Number); return new Date(2000, 0, 1, h, m).toLocaleTimeString('en-IN', { hour: 'numeric', minute: '2-digit' }); };
const ml = n => n.toLocaleString('en-IN') + ' ml';
let tt; const toast = m => { $('toast').textContent = m; $('toast').hidden = false; clearTimeout(tt); tt = setTimeout(() => $('toast').hidden = true, 2200); };

async function call(params) {
  const r = await fetch(API + '?' + new URLSearchParams(params), { credentials: 'omit' });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  entries = j.entries; render();
}

function render() {
  const today = nowParts().date;
  $('today').textContent = 'Aaj · ' + fmtDate(today);
  const t = entries.filter(e => e.date === today);
  const pin = t.filter(e => e.type === 'Pani').reduce((a, e) => a + e.ml, 0);
  const pout = t.filter(e => e.type === 'Urine').reduce((a, e) => a + e.ml, 0);
  const max = Math.max(pin, pout, 1);
  $('fIn').style.width = (pin / max * 100) + '%'; $('fOut').style.width = (pout / max * 100) + '%';
  $('vIn').textContent = ml(pin); $('vOut').textContent = ml(pout);
  const d = pin - pout; $('vDiff').textContent = (d > 0 ? '+' : d < 0 ? '−' : '') + ml(Math.abs(d));

  const days = {};
  entries.forEach(e => (days[e.date] = days[e.date] || []).push(e));
  const keys = Object.keys(days).sort().reverse();
  if (!keys.includes(today)) keys.unshift(today), days[today] = [];
  $('list').innerHTML = '';
  keys.slice(0, 30).forEach(k => {
    const es = days[k].sort((a, b) => (a.time < b.time ? 1 : -1));
    const i = es.filter(e => e.type === 'Pani').reduce((a, e) => a + e.ml, 0), o = es.filter(e => e.type === 'Urine').reduce((a, e) => a + e.ml, 0);
    const c = document.createElement('div'); c.className = 'card';
    c.innerHTML = `<div class="day"><div>${k === today ? 'Aaj · ' : ''}${fmtDate(k)}</div><span>Pani ${ml(i)} · Urine ${ml(o)}</span></div><ul></ul>`;
    const ul = c.querySelector('ul');
    if (!es.length) ul.innerHTML = '<li class="empty" style="display:block">Abhi koi entry nahi</li>';
    es.forEach(e => {
      const li = document.createElement('li');
      const cls = e.type === 'Pani' ? 'in' : 'out';
      li.innerHTML = `<span class="t">${fmtTime(e.time)}</span><span class="${cls}">${e.type}</span><span class="m num">${ml(e.ml)}</span><button aria-label="Delete">✕</button>`;
      const b = li.querySelector('button');
      b.onclick = async () => {
        if (!b.classList.contains('sure')) { b.classList.add('sure'); b.textContent = 'Del?'; setTimeout(() => { b.classList.remove('sure'); b.textContent = '✕'; }, 2500); return; }
        try { await call({ a: 'del', id: e.id }); toast('Delete ho gaya'); } catch (_) { toast('Internet check karein'); }
      };
      ul.appendChild(li);
    });
    $('list').appendChild(c);
  });
}

async function add(t) {
  const v = Math.round(Number($('ml').value));
  if (!(v > 0)) { toast('Pehle ml likho'); $('ml').focus(); return; }
  const p = nowParts();
  $('bIn').disabled = $('bOut').disabled = true;
  try { await call({ a: 'add', t, ml: v, time: p.date + 'T' + p.time }); $('ml').value = ''; toast((t === 'in' ? 'Pani' : 'Urine') + ' ' + ml(v) + ' save'); }
  catch (_) { toast('Save nahi hua, internet check karein'); }
  $('bIn').disabled = $('bOut').disabled = false;
}
$('bIn').onclick = () => add('in');
$('bOut').onclick = () => add('out');

render();
call({ a: 'list' }).catch(() => toast('Load nahi hua, internet check karein'));
setInterval(() => { if (!document.hidden) call({ a: 'list' }).catch(() => {}); }, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) call({ a: 'list' }).catch(() => {}); });
</script>
</body>
</html>
